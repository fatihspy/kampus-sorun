<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kampüs Sorun Bildirim - Yönetim Paneli</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="loginScreen" class="screen">
    <div class="login-box">
      <h1>Kampüs Sorun Bildirim</h1>
      <p class="subtitle">Yönetim Paneli</p>
      <input id="loginEmail" type="email" placeholder="ornek@ege.edu.tr" autocomplete="username" />
      <input id="loginPassword" type="password" placeholder="Şifre" autocomplete="current-password" />
      <button id="loginBtn">Giriş Yap</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <!-- PANEL EKRANI -->
  <div id="panelScreen" class="screen hidden">
    <header>
      <h1>Kampüs Sorun Bildirim <span class="badge">Yönetim</span></h1>
      <div class="header-right">
        <span id="userName"></span>
        <button id="logoutBtn" class="secondary">Çıkış</button>
      </div>
    </header>

    <div class="filters">
      <div class="view-toggle">
        <button id="listViewBtn" class="view-btn active">📋 Liste</button>
        <button id="mapViewBtn" class="view-btn">🗺️ Harita</button>
        <button id="statsViewBtn" class="view-btn">📊 İstatistikler</button>
      </div>
      <select id="statusFilter">
        <option value="">Tüm Durumlar</option>
        <option value="yeni">Yeni</option>
        <option value="inceleniyor">İnceleniyor</option>
        <option value="cozuldu">Çözüldü</option>
      </select>
      <select id="categoryFilter">
        <option value="">Tüm Kategoriler</option>
        <option value="temizlik">Temizlik</option>
        <option value="teknik">Teknik/Bakım</option>
        <option value="guvenlik">Güvenlik</option>
        <option value="diger">Diğer</option>
      </select>
      <button id="refreshBtn" class="secondary">Yenile</button>
      <span id="reportCount" class="count"></span>
    </div>

    <div id="reportGrid" class="report-grid"></div>
    <p id="emptyMessage" class="empty hidden">Bu filtrelere uyan rapor yok.</p>
    <div id="mapContainer" class="map-container hidden"></div>
    <div id="statsContainer" class="stats-container hidden"></div>
  </div>

  <!-- DETAY MODAL -->
  <div id="detailModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-btn">&times;</button>
      <img id="modalPhoto" src="" alt="Rapor fotoğrafı" />
      <div class="modal-info">
        <div class="modal-top-row">
          <h2 id="modalCategory"></h2>
          <span id="modalVoteCount" class="vote-badge"></span>
        </div>
        <p id="modalAnonymousBadge" class="anon-badge hidden">🔒 Anonim olarak gönderildi</p>
        <p id="modalDesc" class="modal-desc"></p>
        <p class="meta"><strong>Bina:</strong> <span id="modalBuilding">-</span></p>
        <p class="meta"><strong>Konum:</strong> <a id="modalMapLink" href="#" target="_blank">Haritada aç</a></p>
        <p class="meta"><strong>Gönderen:</strong> <span id="modalReporter"></span></p>
        <p class="meta"><strong>Tarih:</strong> <span id="modalDate"></span></p>

        <label class="meta" for="statusSelect"><strong>Durum:</strong></label>
        <select id="statusSelect">
          <option value="yeni">Yeni</option>
          <option value="inceleniyor">İnceleniyor</option>
        </select>
        <button id="updateStatusBtn">Durumu Güncelle</button>
        <p id="updateMessage" class="success hidden">Güncellendi ✓</p>

        <div class="resolve-section">
          <p class="meta"><strong>Çözüldü olarak işaretle:</strong></p>
          <div id="resolvedPhotoView" class="hidden">
            <img id="resolvedPhotoImg" src="" alt="Çözüm fotoğrafı" class="resolved-photo" />
            <p class="resolved-note">✓ Bu rapor çözüldü olarak işaretlendi.</p>
          </div>
          <div id="resolveUploadView">
            <input type="file" id="resolvePhotoInput" accept="image/*" />
            <button id="resolveBtn" class="success-btn">Fotoğraflı Çözüldü İşaretle</button>
          </div>
        </div>

        <div class="comments-section">
          <p class="meta"><strong>Yorumlar / Notlar:</strong></p>
          <div id="commentsList"></div>
          <textarea id="newCommentText" placeholder="Öğrenciye görünecek bir not ekle..." rows="2"></textarea>
          <button id="addCommentBtn" class="secondary full-width">Yorum Ekle</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
